{% extends "base.html" %}
{% block head %}<link rel="stylesheet" href="{{ url_for('meter_management.static', filename='css/meter_management.css') }}">{% endblock %}
{% block content %}<div class="container mm-form-page"><div class="mm-page-title"><div><div class="mm-eyebrow">القراءات</div><h3>تسجيل قراءة عداد شبكة</h3></div><a class="btn btn-outline-secondary" href="{{ url_for('meter_management.readings') }}">رجوع</a></div><div class="mm-card mm-form-card"><form method="post"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><div class="row g-3"><div class="col-12"><label class="form-label fw-bold">العداد *</label><select class="form-select" name="meter_id" required>{% for m in meters %}<option value="{{ m.id }}" {% if prefill_meter==m.id %}selected{% endif %}>{{ m.name }} — {{ m.meter_number }}{% if m.location_name %} — {{ m.location_name }}{% endif %}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label fw-bold">تاريخ القراءة *</label><input class="form-control" type="date" name="reading_date" value="{{ today }}" required></div><div class="col-md-6"><label class="form-label fw-bold">القراءة الحالية *</label><input class="form-control form-control-lg" type="number" step="0.01" min="0" name="reading_value" required autofocus></div><div class="col-12"><label class="form-label fw-bold">ملاحظات</label><textarea class="form-control" name="note" rows="3" placeholder="مثال: قراءة فعلية، صورة ميدانية، استبدال..."></textarea></div></div><div class="mm-form-actions"><button class="btn btn-primary btn-lg">حفظ القراءة</button><a class="btn btn-outline-secondary btn-lg" href="{{ url_for('meter_management.readings') }}">إلغاء</a></div></form></div></div>{% endblock %}
