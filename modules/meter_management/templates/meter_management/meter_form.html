{% extends "base.html" %}
{% block head %}<link rel="stylesheet" href="{{ url_for('meter_management.static', filename='css/meter_management.css') }}">{% endblock %}
{% block content %}<div class="container mm-form-page"><div class="mm-page-title"><div><div class="mm-eyebrow">عدادات الشبكة</div><h3>{{ 'إضافة عداد شبكة' if mode=='new' else 'تعديل العداد' }}</h3></div><a class="btn btn-outline-secondary" href="{{ url_for('meter_management.meters') }}">رجوع</a></div><div class="mm-card mm-form-card"><form method="post"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><div class="row g-3"><div class="col-md-8"><label class="form-label fw-bold">اسم العداد *</label><input class="form-control" name="name" value="{{ meter.name or '' }}" required placeholder="عداد مدخل الخزان"></div><div class="col-md-4"><label class="form-label fw-bold">رقم العداد *</label><input class="form-control" name="meter_number" value="{{ meter.meter_number or '' }}" required></div><div class="col-md-4"><label class="form-label fw-bold">النوع</label><select class="form-select" name="meter_type"><option value="main" {% if (meter.meter_type or 'main')=='main' %}selected{% endif %}>رئيسي</option><option value="branch" {% if meter.meter_type=='branch' %}selected{% endif %}>فرعي للشبكة</option></select></div><div class="col-md-4"><label class="form-label fw-bold">الوحدة</label><select class="form-select" name="unit_id"><option value="">بدون وحدة</option>{% for u in units %}<option value="{{ u.id }}" {% if meter.unit_id==u.id %}selected{% endif %}>{{ u.name }}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label fw-bold">الموقع المرتبط</label><select class="form-select" name="location_id"><option value="">غير محدد</option>{% for p in locations %}<option value="{{ p.id }}" {% if meter.location_id==p.id %}selected{% endif %}>{{ p.path }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label fw-bold">العداد الأب</label><select class="form-select" name="parent_meter_id"><option value="">لا يوجد — عداد مستقل</option>{% for p in parents %}<option value="{{ p.id }}" {% if meter.parent_meter_id==p.id %}selected{% endif %}>{{ p.name }} — {{ p.meter_number }}</option>{% endfor %}</select></div><div class="col-md-3"><label class="form-label fw-bold">القراءة الابتدائية</label><input class="form-control" type="number" step="0.01" min="0" name="initial_reading" value="{{ meter.initial_reading or 0 }}"></div><div class="col-md-3"><label class="form-label fw-bold">تاريخ التركيب</label><input class="form-control" type="date" name="installed_at" value="{{ meter.installed_at or '' }}"></div><div class="col-md-4"><label class="form-label fw-bold">الحالة</label><select class="form-select" name="status"><option value="active" {% if (meter.status or 'active')=='active' %}selected{% endif %}>نشط</option><option value="stopped" {% if meter.status=='stopped' %}selected{% endif %}>متوقف</option><option value="replaced" {% if meter.status=='replaced' %}selected{% endif %}>مستبدل</option></select></div><div class="col-12"><label class="form-label fw-bold">ملاحظات</label><textarea class="form-control" name="notes" rows="3">{{ meter.notes or '' }}</textarea></div></div><div class="mm-form-actions"><button class="btn btn-primary btn-lg">حفظ العداد</button><a class="btn btn-outline-secondary btn-lg" href="{{ url_for('meter_management.meters') }}">إلغاء</a></div></form></div></div>{% endblock %}
