{% extends "base.html" %}
{% block head %}<link rel="stylesheet" href="{{ url_for('meter_management.static', filename='css/meter_management.css') }}">{% endblock %}
{% block content %}<div class="container mm-form-page"><div class="mm-page-title"><div><div class="mm-eyebrow">الوحدات</div><h3>{{ 'إضافة وحدة' if mode=='new' else 'تعديل الوحدة' }}</h3></div><a class="btn btn-outline-secondary" href="{{ url_for('meter_management.units') }}">رجوع</a></div><div class="mm-card mm-form-card"><form method="post"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><div class="row g-3"><div class="col-md-4"><label class="form-label fw-bold">الرمز</label><input class="form-control" name="code" value="{{ unit.code or '' }}" placeholder="UNIT-01"></div><div class="col-md-8"><label class="form-label fw-bold">اسم الوحدة *</label><input class="form-control" name="name" value="{{ unit.name or '' }}" required></div><div class="col-md-4"><label class="form-label fw-bold">الترتيب</label><input class="form-control" type="number" name="sort_order" value="{{ unit.sort_order if unit.sort_order is not none else 0 }}"></div><div class="col-md-8"><label class="form-label fw-bold">الحالة</label><select class="form-select" name="active"><option value="1" {% if unit.active is not defined or unit.active %}selected{% endif %}>نشطة</option><option value="0" {% if unit.active is defined and not unit.active %}selected{% endif %}>متوقفة</option></select></div><div class="col-12"><label class="form-label fw-bold">ملاحظات</label><textarea class="form-control" name="notes" rows="3">{{ unit.notes or '' }}</textarea></div></div><div class="mm-form-actions"><button class="btn btn-primary btn-lg">حفظ الوحدة</button><a class="btn btn-outline-secondary btn-lg" href="{{ url_for('meter_management.units') }}">إلغاء</a></div></form></div></div>{% endblock %}
