{% extends "base.html" %}
{% block head %}<link rel="stylesheet" href="{{ url_for('meter_management.static', filename='css/meter_management.css') }}">{% endblock %}
{% block content %}<div class="container mm-form-page"><div class="mm-page-title"><div><div class="mm-eyebrow">المواقع</div><h3>{{ 'إضافة موقع جديد' if mode=='new' else 'تعديل الموقع' }}</h3></div><a class="btn btn-outline-secondary" href="{{ url_for('meter_management.locations') }}">رجوع</a></div><div class="mm-card mm-form-card"><form method="post"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><div class="row g-3"><div class="col-md-8"><label class="form-label fw-bold">اسم الموقع *</label><input class="form-control" name="name" value="{{ location.name or '' }}" required placeholder="مثال: مشورة"></div><div class="col-md-4"><label class="form-label fw-bold">نوع المستوى</label><select class="form-select" name="location_type">{% for t in ['محافظة','مديرية','منطقة','قرية','حي','تجمع','موقع'] %}<option value="{{ t }}" {% if (location.location_type or 'منطقة')==t %}selected{% endif %}>{{ t }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label fw-bold">الوحدة التشغيلية</label><select class="form-select" name="unit_id"><option value="">بدون وحدة</option>{% for u in units %}<option value="{{ u.id }}" {% if location.unit_id==u.id %}selected{% endif %}>{{ u.name }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label fw-bold">الموقع الأب</label><select class="form-select" name="parent_id"><option value="">جذر مستقل</option>{% for p in parents %}<option value="{{ p.id }}" {% if location.parent_id==p.id %}selected{% endif %}>{{ p.path }}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label fw-bold">الرمز</label><input class="form-control" name="code" value="{{ location.code or '' }}" placeholder="LOC-01"></div><div class="col-md-4"><label class="form-label fw-bold">الترتيب</label><input class="form-control" type="number" name="sort_order" value="{{ location.sort_order if location.sort_order is not none else 0 }}"></div><div class="col-md-4"><label class="form-label fw-bold">الحالة</label><select class="form-select" name="active"><option value="1" {% if location.active is not defined or location.active %}selected{% endif %}>نشط</option><option value="0" {% if location.active is defined and not location.active %}selected{% endif %}>متوقف</option></select></div><div class="col-12"><label class="form-label fw-bold">ملاحظات</label><textarea class="form-control" name="notes" rows="3">{{ location.notes or '' }}</textarea></div></div><div class="mm-form-actions"><button class="btn btn-primary btn-lg">حفظ الموقع</button><a class="btn btn-outline-secondary btn-lg" href="{{ url_for('meter_management.locations') }}">إلغاء</a></div></form></div></div>{% endblock %}
