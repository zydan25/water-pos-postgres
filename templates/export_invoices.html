<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Language" content="ar">
  <meta name="google" content="notranslate">
  <title>تصدير الفواتير</title>
  <style>
    @page { size: A4 portrait; margin: 5mm; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Amiri', 'Traditional Arabic', 'Tahoma', sans-serif; }
    body { background-color: #ffffff; color: #000000; direction: rtl; padding: 0; }
    .page-container { width: 100%; max-width: 200mm; margin: 0 auto; direction: rtl; }
    .cut-sep {
      border-top: 1px dashed #000;
      margin: 1.5mm 0;
      text-align: center;
      position: relative;
      height: 4px;
    }
    .cut-sep::before {
      content: "✂ اقطع هنا";
      position: relative;
      top: -6.5pt;
      background: #fff;
      padding: 0 4px;
      font-size: 7pt;
      font-weight: bold;
      color: #000;
    }
    .page-group {
      page-break-after: always;
      break-after: page;
    }
    .page-group:last-of-type { page-break-after: auto; break-after: auto; }
  </style>
</head>
<body>
  <div class="page-container">
  {% for single in invoices %}
    {% if loop.index0 % 3 == 0 %}<div class="page-group">{% endif %}
      {% if loop.index0 % 3 != 0 %}<div class="cut-sep"></div>{% endif %}
      {% set invoice = single %}
      {% include "_invoice_card.html" %}
    {% if loop.index % 3 == 0 or loop.last %}</div>{% endif %}
  {% endfor %}
  </div>
</body>
</html>
