<!doctype html>
<html lang="ar" dir="rtl" class="notranslate" translate="no" data-theme="{{ ui_theme|default('light') }}">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Language" content="ar">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل الدخول</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <style>
    :root {
      --app-bg: #eef4ff;
      --app-surface: #ffffff;
      --app-text: #0f172a;
      --app-muted: #64748b;
      --app-primary: #1a56db;
      --app-primary-contrast: #ffffff;
    }
    html[data-theme="dark"] {
      --app-bg: #0b1220;
      --app-surface: #111827;
      --app-text: #e5e7eb;
      --app-muted: #94a3b8;
      --app-primary: #60a5fa;
      --app-primary-contrast: #081120;
    }
    html[data-theme="ocean"] {
      --app-bg: #eff8ff;
      --app-surface: #ffffff;
      --app-text: #0f172a;
      --app-muted: #475569;
      --app-primary: #0284c7;
      --app-primary-contrast: #ffffff;
    }
    body{background:var(--app-bg);color:var(--app-text);min-height:100vh;display:flex;align-items:center}
    .card{background:var(--app-surface);border:0;border-radius:1.2rem;box-shadow:0 1rem 2rem rgba(0,0,0,.08)}
    .text-muted{color:var(--app-muted)!important}
    .btn-primary{background:var(--app-primary);border-color:var(--app-primary);color:var(--app-primary-contrast)}
    .form-control{border-radius:.85rem}
    .btn{border-radius:.85rem}
  </style>
</head>
<body>
<div class="container" style="max-width: 420px;">
  <div class="card p-4 p-md-5">
    
    <h3 class="mb-2 fw-bold text-center">نظام فواتير المياه</h3>
    <p class="text-muted text-center mb-4">تسجيل الدخول الآمن</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    <form method="post">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label">اسم المستخدم</label>
        <input class="form-control" name="username" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">كلمة المرور</label>
        <input type="password" class="form-control" name="password" required>
      </div>
      <button class="btn btn-primary w-100" type="submit">دخول</button>
    </form>
<div class="mb-3 text-center small text-muted">برمجة وتصميم: يمن كود للتقنيات الذكية</div>
  </div>
</div>
</body>
</html>
